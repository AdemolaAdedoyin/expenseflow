<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ExpenseFlow approval inbox</title>
  <desc id="desc">Static preview based on the local ExpenseFlow manager approval inbox used during final regression testing.</desc>
  <rect width="1200" height="650" fill="#f5f7fb"/>
  <rect width="250" height="650" fill="#111c2d"/>
  <text x="28" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Expense<tspan fill="#67c9f4">Flow</tspan></text>
  <text x="28" y="88" font-family="Arial,sans-serif" font-size="16" fill="#9aa6b8">Acme Labs</text>
  <g font-family="Arial,sans-serif" font-size="17" fill="#d4d9e2"><text x="55" y="160">Overview</text><text x="55" y="215">Expenses</text><text x="55" y="270">Approvals</text><text x="55" y="325">Policies</text></g>
  <rect x="18" y="235" width="214" height="54" rx="12" fill="#263348"/>
  <text x="55" y="269" font-family="Arial,sans-serif" font-size="17" fill="#ffffff">Approvals</text>
  <rect x="250" width="950" height="86" fill="#ffffff"/>
  <text x="1120" y="38" text-anchor="end" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#182234">Morgan Lee</text>
  <text x="1120" y="62" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#7a8599">MANAGER</text>
  <text x="300" y="145" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#121b2e">Approval inbox</text>
  <text x="300" y="178" font-family="Arial,sans-serif" font-size="16" fill="#737f94">Review expenses currently waiting on you.</text>
  <g font-family="Arial,sans-serif">
    <rect x="300" y="220" width="395" height="250" rx="16" fill="#ffffff" stroke="#dfe4ec"/>
