    <text x="326" y="296" font-size="24" font-weight="700" fill="#172034">Pleaee</text>
    <text x="326" y="324" font-size="15" fill="#778195">Travel · 9/10/2026</text>
    <text x="326" y="372" font-size="34" font-weight="700" fill="#111b2d">$100.00</text>
    <rect x="480" y="405" width="88" height="40" rx="8" fill="#fff2f2"/>
    <text x="524" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#d44f5c">Reject</text>
    <rect x="578" y="405" width="88" height="40" rx="8" fill="#4e7cf3"/>
    <text x="622" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Approve</text>

    <rect x="725" y="220" width="395" height="250" rx="16" fill="#ffffff" stroke="#dfe4ec"/>
    <text x="751" y="255" font-size="13" font-weight="700" fill="#8893a5">MANAGER REVIEW</text>
    <text x="751" y="296" font-size="24" font-weight="700" fill="#172034">Pleaee</text>
    <text x="751" y="324" font-size="15" fill="#778195">Travel · 9/10/2026</text>
    <text x="751" y="372" font-size="34" font-weight="700" fill="#111b2d">$2,600.00</text>
    <rect x="905" y="405" width="88" height="40" rx="8" fill="#fff2f2"/>
    <text x="949" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#d44f5c">Reject</text>
    <rect x="1003" y="405" width="88" height="40" rx="8" fill="#4e7cf3"/>
    <text x="1047" y="431" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Approve</text>
  </g>
  <rect x="300" y="505" width="820" height="78" rx="12" fill="#edf4ff"/>
  <text x="325" y="538" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#35507a">Workflow regression</text>
  <text x="325" y="563" font-family="Arial,sans-serif" font-size="14" fill="#52657e">Employee submission → manager decision → finance routing is covered by the API end-to-end suite.</text>
